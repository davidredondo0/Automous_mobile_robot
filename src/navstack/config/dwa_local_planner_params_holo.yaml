DWAPlannerROS:

# Robot Configuration Parameters
  max_vel_x: 0.15
  min_vel_x: -0.15

  max_vel_y: 0.15
  min_vel_y: -0.15

  # These are used by move_base for overall translation limit
  max_vel_trans: 0.15
  min_vel_trans: 0.0

  max_rot_vel: 0.15
  min_rot_vel: -0.15
  max_vel_theta: 0.15
  min_vel_theta: -0.15


  escape_reset_theta: 0.1
  escape_vel: 0.1


# Acceleration limits (REDUCED for smooth motion)
  acc_lim_x: 0.05
  acc_lim_y: 0.05
  acc_lim_theta: 0.05

  holonomic_robot: true
# Goal Tolerance Parametes
  xy_goal_tolerance: 0.2
  yaw_goal_tolerance: 0.5
  latch_xy_goal_tolerance: true


# Forward Simulation Parameters
  use_dwa: true  
  sim_time: 2.5
  sim_granularity: 0.1
  angular_sim_granularity: 0.15
  vx_samples: 4
  vy_samples: 4
  vth_samples: 3
  controller_frequency: 10.0

# Trajectory Scoring Parameters (increased bias for smooth changes)
  path_distance_bias: 64.0
  goal_distance_bias: 48.0
  occdist_scale: 0.2
  heading_lookahead: 0.325
  forward_point_distance: 0.325
  stop_time_buffer: 0.2
  scaling_speed: 0.1
  max_scaling_factor: 0.05

# Oscillation Prevention Parameters
  oscillation_reset_dist: 0.05
  oscillation_reset_angle: 0.20
  prune_plan: true
  trans_stopped_vel: 0.02
  theta_stopped_vel: 0.02

# Debugging
  publish_traj_pc : false
  publish_cost_grid_pc: false
