DWAPlannerROS:

# Robot Configuration Parameters
  max_vel_x: 0.5
  min_vel_x: -0.5

  max_vel_y: 0.5
  min_vel_y: -0.5

  # These are used by move_base for overall translation limit
  max_vel_trans: 0.5
  min_vel_trans: 0.2
  max_rot_vel: 0.5
  min_rot_vel: 0.2
  max_vel_theta: 0.5
  min_vel_theta: 0.2

  escape_reset_theta: 0.1
  escape_vel: 0.1


# Acceleration limits 
  acc_lim_x: 1.0
  acc_lim_y: 1.0
  acc_lim_theta: 1.0

  holonomic_robot: true
# Goal Tolerance Parametes
  xy_goal_tolerance: 0.2
  yaw_goal_tolerance: 0.2
  latch_xy_goal_tolerance: true


# Forward Simulation Parameters
  use_dwa: true  
  sim_time: 1.2
  sim_granularity: 0.1
  angular_sim_granularity: 0.15
  vx_samples: 20
  vy_samples: 20
  vth_samples: 40
  controller_frequency: 10.0

# Trajectory Scoring Parameters
  path_distance_bias: 32.0
  goal_distance_bias: 24.0
  occdist_scale: 0.01
  forward_point_distance: 0.0
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2
  
# Oscillation Prevention Parameters
  oscillation_reset_dist: 0.05
  oscillation_reset_angle: 0.20
  prune_plan: true
  trans_stopped_vel: 0.02
  theta_stopped_vel: 0.02

# Debugging
  publish_traj_pc : false
  publish_cost_grid_pc: false

